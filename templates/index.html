<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexFood - Atendimento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="logo">🍔 NexFood</h1>
                    <span class="subtitle">Atendimento Virtual</span>
                </div>
                <div class="header-right">
                    <label for="cliente-select" class="cliente-label">Cliente:</label>
                    <select id="cliente-select" class="cliente-select">
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Container Principal -->
        <main class="main-container">
            <!-- Área de Mensagens -->
            <div id="chat-container" class="chat-container">
                <div id="mensagens" class="mensagens">
                    <!-- Mensagens aparecerão aqui -->
                </div>
                
                <!-- Indicador de digitação -->
                <div id="typing-indicator" class="typing-indicator" style="display: none;">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text">Alex está digitando...</span>
                </div>
            </div>

            <!-- Área de Input -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="mensagem-input" 
                        class="mensagem-input" 
                        placeholder="Digite sua mensagem..."
                        rows="1"
                        disabled
                    ></textarea>
                    <button id="enviar-btn" class="enviar-btn" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-info">
                    <span id="char-count">0 / 2000</span>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Projeto de portfólio - Agente de IA com tool use</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
